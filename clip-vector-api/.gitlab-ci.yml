stages:
  - deploy

deploy-to-dev:
  image: alpine/ansible:2.18.6
  stage: deploy
  only:
    - develop
  before_script:
    - cat $DEV_INVENTORY >> "$CI_PROJECT_DIR/ansible/inventory.yml"
    - cat $DEV_SSH_PRIVATE_KEY >> "$CI_PROJECT_DIR/ansible/private-key.pem"
    - chmod 700 "$CI_PROJECT_DIR/ansible"
    - chmod 600 "$CI_PROJECT_DIR/ansible/private-key.pem"
    - apk add --no-cache curl
  script:
    - curl https://ifconfig.me
    - cd "$CI_PROJECT_DIR/ansible"
    - ansible-playbook playbook.yml -i inventory.yml --private-key private-key.pem
  when: manual

deploy-to-test:
  image: alpine/ansible:2.18.6
  stage: deploy
  only:
    - "/^test-.*$/"
  before_script:
    - cat $TEST_INVENTORY >> "$CI_PROJECT_DIR/ansible/inventory.yml"
    - cat $TEST_SSH_PRIVATE_KEY >> "$CI_PROJECT_DIR/ansible/private-key.pem"
    - chmod 700 "$CI_PROJECT_DIR/ansible"
    - chmod 600 "$CI_PROJECT_DIR/ansible/private-key.pem"
    - apk add --no-cache curl
  script:
    - curl https://ifconfig.me
    - cd "$CI_PROJECT_DIR/ansible"
    - ansible-playbook playbook.yml -i inventory.yml --private-key private-key.pem
  when: manual
